# Builds TrayHider.exe directly from TrayHider.ahk on a Windows GitHub-hosted
# runner every time a version tag (e.g. v1.0.0) is pushed, then attaches the
# compiled .exe and its SHA256 checksum to a GitHub Release.
#
# Why this matters: anyone can open the "Actions" tab for a given release and
# see the exact, unmodified build log — the binary is provably built from the
# source in this repo, not compiled privately and uploaded blind.

name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download AutoHotkey v2 + Ahk2Exe (official GitHub releases)
        run: |
          # Ask the GitHub API for the latest release of each official repo and
          # grab its .zip asset — no hardcoded URLs or versions to go stale.
          $ahkRel  = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest"
          $ahkZip  = $ahkRel.assets  | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          $cplRel  = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $cplZip  = $cplRel.assets  | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1

          Write-Host "AutoHotkey asset : $($ahkZip.name)"
          Write-Host "Ahk2Exe asset    : $($cplZip.name)"

          Invoke-WebRequest $ahkZip.browser_download_url -OutFile "ahk.zip"
          Invoke-WebRequest $cplZip.browser_download_url -OutFile "ahk2exe.zip"
          Expand-Archive "ahk.zip"     -DestinationPath "ahk"
          Expand-Archive "ahk2exe.zip" -DestinationPath "ahk2exe"
        shell: pwsh

      - name: Compile TrayHider.ahk to TrayHider.exe
        run: |
          $ahk2exe = Get-ChildItem -Path "ahk2exe" -Recurse -Filter "Ahk2Exe.exe" | Select-Object -First 1
          $base    = Get-ChildItem -Path "ahk"     -Recurse -Filter "AutoHotkey64.exe" | Select-Object -First 1

          if (-not $ahk2exe) {
            Get-ChildItem -Path "ahk2exe" -Recurse | Select-Object FullName | Out-String | Write-Host
            Write-Error "Ahk2Exe.exe not found in the downloaded compiler package."
            exit 1
          }
          if (-not $base) {
            Get-ChildItem -Path "ahk" -Recurse | Select-Object FullName | Out-String | Write-Host
            Write-Error "AutoHotkey64.exe not found in the downloaded AutoHotkey package."
            exit 1
          }

          Write-Host "Compiler : $($ahk2exe.FullName)"
          Write-Host "Base     : $($base.FullName)"

          # /silent is required on a headless runner — otherwise Ahk2Exe may
          # try to open a GUI dialog nobody can click and the job hangs.
          Start-Process -FilePath $ahk2exe.FullName -Wait -NoNewWindow -ArgumentList @(
            "/silent", "verbose",
            "/in",   "`"$PWD\TrayHider.ahk`"",
            "/out",  "`"$PWD\TrayHider.exe`"",
            "/base", "`"$($base.FullName)`""
          )

          # Ahk2Exe may return before the file is flushed; wait briefly
          $tries = 0
          while (!(Test-Path "TrayHider.exe") -and $tries -lt 10) {
            Start-Sleep -Seconds 1
            $tries++
          }
        shell: pwsh

      - name: Verify the .exe was actually produced
        run: |
          if (!(Test-Path "TrayHider.exe")) {
            Write-Error "Compilation failed: TrayHider.exe was not created."
            exit 1
          }
        shell: pwsh

      - name: Generate SHA256 checksum
        run: |
          $hash = Get-FileHash -Path "TrayHider.exe" -Algorithm SHA256
          "$($hash.Hash)  TrayHider.exe" | Out-File -FilePath "TrayHider.exe.sha256.txt" -Encoding ascii
          Get-Content "TrayHider.exe.sha256.txt"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TrayHider.exe
            TrayHider.exe.sha256.txt
            TrayHider.ahk
          body: |
            Automated build compiled directly from the source in this repository
            by GitHub Actions — see the Actions tab for the full build log.

            **Before running:** if your antivirus flags `TrayHider.exe`, this is
            a known false positive common to compiled AutoHotkey scripts — see
            the README for an explanation and how to verify the binary or
            build it yourself.

            Verify the download with:
            ```powershell
            certutil -hashfile TrayHider.exe SHA256
            ```
            and compare against `TrayHider.exe.sha256.txt`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
